<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>租賃管理人員的人森 — 代管房東的日常修羅場</title>
<style>
:root{
color-scheme: light;
--f900:#0f1f17; --f800:#1a2e22; --f700:#243d2d;
--f500:#3d6b4a; --moss:#6b8e5a; --beige:#f1e9d2;
--beige-dim:#d9cfb4; --paper:#faf6ea; --warn:#c25a3b;
--gold:#c9a24a; --wood:#8c7a4e; --stone:#a89f8a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-touch-callout:none;}
html,body{background:#0f1f17;height:100%;width:100%;font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;color:var(--beige);overflow:hidden;position:fixed;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
#stage{position:relative;width:100%;height:100%;max-width:460px;margin:0 auto;background:linear-gradient(180deg,#1a2e22 0%,#0f1f17 100%);display:flex;flex-direction:column;}
#hud{padding:env(safe-area-inset-top,0) 10px 6px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);background:linear-gradient(180deg,rgba(15,31,23,.95),rgba(15,31,23,.7));z-index:5;flex-shrink:0;}
.hud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.day-time{font-family:"Noto Serif TC",serif;color:var(--moss);font-size:12px;letter-spacing:.08em;}
.day-time b{color:var(--beige);font-size:16px;}
.cash{font-size:18px;font-weight:900;color:var(--gold);}
.cash.neg{color:var(--warn);}
.hud-bars{display:flex;gap:5px;}
.b{flex:1;background:rgba(241,233,210,.08);border:1px solid rgba(241,233,210,.15);border-radius:6px;padding:3px 7px;font-size:10px;}
.b-l{display:flex;justify-content:space-between;letter-spacing:.08em;color:rgba(241,233,210,.65);}
.b-l b{color:var(--beige);font-weight:700;}
.bar{height:3px;background:rgba(0,0,0,.4);border-radius:2px;margin-top:2px;overflow:hidden;}
.bar>i{display:block;height:100%;transition:width .3s;}
#sceneWrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#2d4a35 0%,#1a2e22 70%);min-height:0;}
#scene{position:absolute;inset:0;width:100%;height:100%;}
.unit-label{font-size:9px;font-weight:800;fill:#faf6ea;text-anchor:middle;font-family:ui-monospace,monospace;letter-spacing:0.05em;pointer-events:none;}
.unit-sub{font-size:7px;fill:rgba(241,233,210,.75);text-anchor:middle;pointer-events:none;}
.warn-icon{animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.click-zone{cursor:pointer;}
.click-zone:active{opacity:.7;}
.player-sprite{transition:transform .6s ease;pointer-events:none;}
.ring{animation:pulse 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
@keyframes pulse{0%,100%{opacity:.35;r:14;}50%{opacity:.7;r:17;}}
#sheet{position:absolute;top:102px;left:8px;right:8px;z-index:4;}
.sheet-head{background:rgba(15,31,23,.92);border:1px solid rgba(201,162,74,.45);border-radius:8px 8px 0 0;padding:6px 12px;font-size:11px;letter-spacing:.15em;color:var(--gold);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.sheet-head .count{background:var(--warn);color:#fff;border-radius:999px;padding:1px 7px;font-size:10px;letter-spacing:0;}
.sheet-body{background:rgba(250,246,234,.97);color:#2a2a2a;border-radius:0 0 8px 8px;max-height:160px;overflow-y:auto;border:1px solid rgba(201,162,74,.45);border-top:none;}
.sheet-body.collapsed{display:none;}
.task{padding:7px 12px;border-bottom:1px solid #e8dfc3;font-size:12px;line-height:1.4;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.task:last-child{border-bottom:none;}
.task:active{background:#f1e9d2;}
.task-unit{font-family:ui-monospace,monospace;font-weight:800;color:#243d2d;font-size:11px;flex-shrink:0;}
.task-text{flex:1;color:#444;font-size:11px;}
.task-badge{font-size:10px;padding:2px 7px;border-radius:4px;flex-shrink:0;}
.b-urgent{background:#c25a3b;color:#fff;}
.b-wait{background:#c9a24a;color:#fff;}
.b-done{background:#9ad17f;color:#1a3a1f;}
#actionBar{background:rgba(15,31,23,.95);padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid rgba(107,142,90,.4);z-index:6;flex-shrink:0;}
.act-label{font-size:10px;letter-spacing:.2em;color:var(--moss);margin-bottom:6px;}
.act-row{display:flex;gap:6px;flex-wrap:wrap;}
.act-btn{flex:1;min-width:90px;background:var(--moss);color:#0f1f17;font-weight:800;border-radius:8px;padding:11px 8px;font-size:13px;box-shadow:0 3px 0 #4a6a3d;transition:transform .08s;}
.act-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4a6a3d;}
.act-btn.ghost{background:rgba(241,233,210,.1);color:var(--beige);border:1px solid rgba(241,233,210,.25);box-shadow:none;}
.act-btn.ghost:active{background:rgba(241,233,210,.2);}
.act-btn.warn{background:var(--warn);color:#fff;box-shadow:0 3px 0 #8c3f28;}
.act-btn.gold{background:var(--gold);color:#2a1f00;box-shadow:0 3px 0 #8c6e2b;}
.act-btn.locked{background:rgba(241,233,210,.08);color:rgba(241,233,210,.4);box-shadow:none;cursor:not-allowed;}
.modal-bg{position:absolute;inset:0;background:rgba(15,31,23,.88);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--paper);color:#2a2a2a;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:slide .3s cubic-bezier(.2,.9,.3,1);}
@keyframes slide{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-portrait{background:linear-gradient(180deg,#243d2d 0%,#1a2e22 100%);padding:18px 20px 14px;color:var(--beige);display:flex;gap:14px;align-items:center;position:relative;}
.portrait{width:66px;height:66px;background:var(--beige);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.4);}
.mp-info{flex:1;}
.mp-unit{font-family:ui-monospace,monospace;font-size:11px;color:var(--moss);letter-spacing:.1em;}
.mp-name{font-size:16px;font-weight:900;color:var(--beige);margin:1px 0 3px;}
.mp-tag{display:inline-block;background:rgba(201,162,74,.25);color:var(--gold);font-size:10px;padding:2px 8px;border-radius:999px;letter-spacing:.08em;}
.mp-time{position:absolute;top:14px;right:16px;font-size:11px;color:rgba(241,233,210,.6);font-family:ui-monospace,monospace;}
.modal-body{padding:16px 20px 20px;}
.m-desc{font-size:14px;line-height:1.65;color:#333;margin-bottom:14px;background:#fff;padding:12px 14px;border-radius:10px;border-left:3px solid var(--moss);font-style:italic;}
.m-prompt{font-size:11px;letter-spacing:.2em;color:#8a8578;margin-bottom:8px;}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #d9cfb4;border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:border-color .1s;}
.choice:active{background:#f1e9d2;}
.choice:hover{border-color:var(--f500);}
.ch-text{font-weight:800;color:#1a1a1a;font-size:14px;margin-bottom:3px;}
.ch-note{font-size:11px;color:#666;line-height:1.5;}
.ch-deltas{margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;font-size:11px;font-family:ui-monospace,monospace;}
.pos{color:#1a7a3d;font-weight:700;}.neg{color:#c2412b;font-weight:700;}
#toast{position:absolute;top:98px;left:50%;transform:translateX(-50%);z-index:7;pointer-events:none;}
.msg{background:rgba(15,31,23,.92);color:var(--beige);padding:7px 14px;border-radius:999px;font-size:12px;margin-bottom:4px;border:1px solid rgba(107,142,90,.4);animation:popmsg 2.6s ease forwards;max-width:380px;text-align:center;}
@keyframes popmsg{0%{opacity:0;transform:translateY(-6px);}10%{opacity:1;transform:translateY(0);}85%{opacity:1;}100%{opacity:0;}}
.delta{position:absolute;left:50%;top:40%;transform:translateX(-50%);pointer-events:none;font-weight:900;font-size:24px;z-index:35;text-shadow:0 2px 10px rgba(0,0,0,.7);animation:floatd 1.5s ease-out forwards;white-space:nowrap;}
@keyframes floatd{0%{opacity:0;transform:translate(-50%,10px);}20%{opacity:1;}100%{opacity:0;transform:translate(-50%,-55px);}}
.screen{position:absolute;inset:0;background:linear-gradient(180deg,#0f1f17 0%,#1a2e22 40%,#0f1f17 100%);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;overflow-y:auto;}
.brand{font-size:11px;letter-spacing:.4em;color:var(--moss);margin-bottom:12px;}
.title-logo{font-family:"Noto Serif TC",serif;letter-spacing:.08em;text-shadow:0 2px 10px rgba(0,0,0,.6);font-weight:900;line-height:1.1;color:var(--beige);}
.title-xl{font-size:42px;margin-bottom:6px;}
.sub{font-size:13px;color:rgba(241,233,210,.7);margin-bottom:26px;}
.card-i{background:var(--paper);color:#2a2a2a;border-radius:12px;padding:16px;text-align:left;max-width:340px;width:100%;margin-bottom:14px;font-size:13px;line-height:1.65;}
.card-i b{color:var(--f700);}
.mode-pick{display:flex;gap:10px;max-width:340px;width:100%;margin-bottom:14px;}
.mode{flex:1;background:rgba(241,233,210,.08);border:1.5px solid rgba(241,233,210,.25);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;}
.mode:active{background:rgba(241,233,210,.15);}
.mode b{display:block;color:var(--beige);font-size:15px;margin-bottom:4px;}
.mode span{font-size:11px;color:rgba(241,233,210,.65);line-height:1.4;}
.mode.locked{opacity:.55;cursor:not-allowed;}
.mode.locked::before{content:"🔒 ";}
.mode.primary{background:var(--moss);border-color:var(--moss);}
.mode.primary b{color:#0f1f17;}.mode.primary span{color:#2a3a22;}
.btn-p{background:var(--moss);color:#0f1f17;font-weight:900;border-radius:10px;padding:14px 24px;font-size:16px;box-shadow:0 5px 0 #4a6a3d;max-width:340px;width:100%;}
.btn-p:active{transform:translateY(2px);box-shadow:0 3px 0 #4a6a3d;}
.btn-g{background:transparent;color:var(--beige);border:1px solid rgba(241,233,210,.3);border-radius:10px;padding:12px 20px;font-size:13px;margin-top:10px;}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;font-size:12px;color:#444;}
.end-stats b{color:#111;}
.end-tag{font-size:11px;letter-spacing:.4em;margin-bottom:8px;}
.end-tag.win{color:var(--moss);}.end-tag.lose{color:var(--warn);}
.hide{display:none !important;}
</style>
</head>
<body>
<div id="stage">
<!-- HUD -->
<div id="hud" class="hide">
<div class="hud-top">
<div class="day-time">DAY <b id="dayNum">1</b> · <span id="timeNow">09:00</span></div>
<div class="cash" id="cash">$50,000</div>
</div>
<div class="hud-bars">
<div class="b"><div class="b-l"><span>聲譽</span><b id="repN">60</b></div><div class="bar"><i id="repBar" style="width:60%;background:#9ad17f"></i></div></div>
<div class="b"><div class="b-l"><span>體力</span><b id="hpN">100</b></div><div class="bar"><i id="hpBar" style="width:100%;background:#e8b84a"></i></div></div>
<div class="b"><div class="b-l"><span>房源</span><b id="rmN">6</b></div><div class="bar"><i style="width:100%;background:#6b8e5a"></i></div></div>
</div>
</div>
<!-- Scene -->
<div id="sceneWrap" class="hide">
<svg id="scene" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<!-- Handover Sheet -->
<div id="sheet" class="hide">
<div class="sheet-head" id="sheetHead">
<span>📋 今日交班單</span>
<span class="count" id="sheetCount">0</span>
</div>
<div class="sheet-body collapsed" id="sheetBody"></div>
</div>
<!-- Action Bar -->
<div id="actionBar" class="hide">
<div class="act-label" id="actLabel">下一步做什麼？</div>
<div class="act-row" id="actRow"></div>
</div>
<div id="toast"></div>
<!-- Intro -->
<div class="screen" id="intro">
<div class="brand">A GAME BY @a0921925365</div>
<h1 class="title-logo title-xl">租賃管理<br/>人員的人森</h1>
<div class="sub">v0.3 · 偽等距物管日常版</div>
<div class="card-i">
你是 <b>老柯代管</b>，手上 6 間套房 + 1 間辦公室。<br/>
每天 09:00 進辦公室看 <b>交班單</b>，點位置或按鈕走過去處理。<br/>
做完 <b>下班</b> 進入下一天。<br/>
撐 <b>30 天</b> 不破產、不過勞、不黑掉就贏。
</div>
<div class="mode-pick">
<div class="mode primary" id="modeExp"><b>體驗版</b><span>固定劇本，30 張事件卡</span></div>
<div class="mode locked"><b>Pro 版</b><span>開放式 AI 對話<br/>Coming soon</span></div>
</div>
<button class="btn-p" id="startBtn">開始上班</button>
<div style="font-size:11px;color:rgba(241,233,210,.55);margin-top:12px;">全程點擊操作，手機最適</div>
</div>
<!-- End -->
<div class="screen hide" id="endScr">
<div class="end-tag" id="endTag">GAME OVER</div>
<h1 class="title-logo" style="font-size:34px;margin-bottom:14px;" id="endTitle">人森，暫停</h1>
<div class="card-i">
<div id="endMsg" style="margin-bottom:10px;"></div>
<div class="end-stats" id="endStats"></div>
</div>
<button class="btn-p" id="againBtn">再來一輪</button>
<button class="btn-g" id="shareBtn">分享戰績</button>
</div>
</div>

// Isometric diamond tile at (x,y) with width/height
function tileDiamond(cx, cy, w, h){
return `${cx},${cy-h} ${cx+w},${cy} ${cx},${cy+h} ${cx-w},${cy}`;
}
function buildScene(){
const svg = document.getElementById("scene");

// Ground
const bg = document.createElementNS("http://www.w3.org/2000/svg","polygon");
bg.setAttribute("points", tileDiamond(200, 270, 220, 160));
bg.setAttribute("fill","#324f3a");
bg.setAttribute("stroke","rgba(0,0,0,.2)");
svg.appendChild(bg);
// Pathways
const path = document.createElementNS("http://www.w3.org/2000/svg","polygon");
path.setAttribute("points","200,170 320,250 200,330 80,250");
path.setAttribute("fill","#8c7a4e");
path.setAttribute("opacity","0.7");
svg.appendChild(path);
// Courtyard dots
for(let i=0;i<8;i++){
const d = document.createElementNS("http://www.w3.org/2000/svg","circle");
d.setAttribute("cx", 180+Math.random()*40);
d.setAttribute("cy", 240+Math.random()*40);
d.setAttribute("r", 1.5);
d.setAttribute("fill","#5a4a2e");
svg.appendChild(d);
}
// Draw buildings (isometric boxes)
function building(cx, cy, w, h, depth, color, unitKey, color2){
const g = document.createElementNS("http://www.w3.org/2000/svg","g");
g.setAttribute("class","click-zone");
g.dataset.loc = unitKey;
g.addEventListener("click",()=>onLocationClick(unitKey));
// base shadow
const sh = document.createElementNS("http://www.w3.org/2000/svg","polygon");
sh.setAttribute("points", tileDiamond(cx, cy+2, w+4, h/2+2));
sh.setAttribute("fill","rgba(0,0,0,.35)");
g.appendChild(sh);
// right face
const rf = document.createElementNS("http://www.w3.org/2000/svg","polygon");
rf.setAttribute("points", `${cx+w},${cy} ${cx},${cy+h/2} ${cx},${cy+h/2-depth} ${cx+w},${cy-depth}`);
rf.setAttribute("fill", color2);
g.appendChild(rf);
// left face
const lf = document.createElementNS("http://www.w3.org/2000/svg","polygon");
lf.setAttribute("points", `${cx-w},${cy} ${cx},${cy+h/2} ${cx},${cy+h/2-depth} ${cx-w},${cy-depth}`);
lf.setAttribute("fill", color);
g.appendChild(lf);
// top
const tp = document.createElementNS("http://www.w3.org/2000/svg","polygon");
tp.setAttribute("points", `${cx},${cy-h/2-depth} ${cx+w},${cy-depth} ${cx},${cy+h/2-depth} ${cx-w},${cy-depth}`);
tp.setAttribute("fill", "#5a7a5e");
g.appendChild(tp);
// door
const dr = document.createElementNS("http://www.w3.org/2000/svg","rect");
dr.setAttribute("x", cx-6);
dr.setAttribute("y", cy+h/2-depth-18);
dr.setAttribute("width", 12);
dr.setAttribute("height", 16);
dr.setAttribute("fill", "#3d2b1a");
g.appendChild(dr);
// window
const wn = document.createElementNS("http://www.w3.org/2000/svg","rect");
wn.setAttribute("x", cx-w+8);
wn.setAttribute("y", cy+h/2-depth-28);
wn.setAttribute("width", 10);
wn.setAttribute("height", 10);
wn.setAttribute("fill", "#c9d9c5");
g.appendChild(wn);
// label
const lb = document.createElementNS("http://www.w3.org/2000/svg","text");
lb.setAttribute("class","unit-label");
lb.setAttribute("x", cx);
lb.setAttribute("y", cy+h/2+10);
lb.textContent = LOCATIONS[unitKey].label;
g.appendChild(lb);
svg.appendChild(g);
return g;
}

bench.setAttribute("x", 185); bench.setAttribute("y", 280);
bench.setAttribute("width", 30); bench.setAttribute("height", 6);
bench.setAttribute("fill", "#7a5e2a");
ct.appendChild(bench);
const tree = document.createElementNS("http://www.w3.org/2000/svg","text");
tree.setAttribute("x", 230); tree.setAttribute("y", 290);
tree.setAttribute("font-size","20"); tree.textContent="🌳";
ct.appendChild(tree);
svg.appendChild(ct);
// Warning icons for active tasks
S.tasks.filter(t=>t.status==="open").forEach(task=>{
const loc = LOCATIONS[task.unit];
if(!loc) return;
const g = document.createElementNS("http://www.w3.org/2000/svg","g");
g.setAttribute("class","warn-icon");
g.setAttribute("transform",`translate(${loc.x+22},${loc.y-32})`);
const bg = document.createElementNS("http://www.w3.org/2000/svg","circle");
bg.setAttribute("r","12"); bg.setAttribute("fill","#c25a3b"); bg.setAttribute("stroke","#faf6ea"); bg.setAttribute("stroke-width","2");
g.appendChild(bg);
const tx = document.createElementNS("http://www.w3.org/2000/svg","text");
tx.setAttribute("text-anchor","middle"); tx.setAttribute("y","4"); tx.setAttribute("font-size","13"); tx.setAttribute("font-weight","900"); tx.setAttribute("fill","#fff");
tx.textContent="!";
g.appendChild(tx);
svg.appendChild(g);
});
// Player sprite ring
const loc = LOCATIONS[S.playerPos] || LOCATIONS.office;
const ring = document.createElementNS("http://www.w3.org/2000/svg","circle");
ring.setAttribute("class","ring");
ring.setAttribute("cx", loc.x); ring.setAttribute("cy", loc.y+4);
ring.setAttribute("r","14"); ring.setAttribute("fill","none");
ring.setAttribute("stroke","#c9a24a"); ring.setAttribute("stroke-width","2");
svg.appendChild(ring);
// Player (property manager)
const player = document.createElementNS("http://www.w3.org/2000/svg","g");
player.setAttribute("id","playerG");
player.setAttribute("class","player-sprite");
player.setAttribute("transform",`translate(${loc.x},${loc.y})`);
const ps = document.createElementNS("http://www.w3.org/2000/svg","text");
ps.setAttribute("text-anchor","middle"); ps.setAttribute("y","5"); ps.setAttribute("font-size","26");
ps.textContent="🧑‍💼";
player.appendChild(ps);
svg.appendChild(player);
}
function movePlayerTo(locKey){
const loc = LOCATIONS[locKey];
if(!loc) return;
S.playerPos = locKey;
const player = document.getElementById("playerG");
if(player) player.setAttribute("transform",`translate(${loc.x},${loc.y})`);
// move the ring too — simplest: rebuild scene
buildScene();
}
// ===== Tasks (handover sheet) =====
function pickEvent(preferProp=false){
const pool = EVENTS.filter(e=>!S.seen.includes(e.id) && (!preferProp || e.unit));
const src = pool.length?pool:EVENTS.filter(e=>!S.seen.includes(e.id));
const src2 = src.length?src:EVENTS;
const ev = src2[Math.floor(Math.random()*src2.length)];
S.seen.push(ev.id);
return ev;
}
function generateDayTasks(){
S.tasks = [];
// 2-4 tasks per day
const n = 2 + Math.floor(Math.random()*3);
const units = ["A101","A102","B201","B202","C301","C302","D401"];
for(let i=0;i<n;i++){
const ev = pickEvent(true);
const unit = ev.unit || units[Math.floor(Math.random()*units.length)];
S.tasks.push({id:"t"+Date.now()+i, unit:unit, event:ev, status:"open"});
}
renderSheet();
}
function renderSheet(){
const sb = document.getElementById("sheetBody");
const open = S.tasks.filter(t=>t.status==="open");
document.getElementById("sheetCount").textContent = open.length + " 項";
if(!S.tasks.length){
sb.innerHTML = `<div style="padding:14px;text-align:center;color:#999;font-size:12px;">今天沒有待辦，可以直接下班</div>`;
return;
}
sb.innerHTML = S.tasks.map(t=>{
const badge = t.status==="done" ? '<span class="task-badge b-done">完成</span>' :
t.event.tag==="急修"||t.event.tag==="投訴"||t.event.tag==="欠租" ? '<span class="task-badge b-urgent">緊急</span>' :
'<span class="task-badge b-wait">待處理</span>';
return `<div class="task" data-tid="${t.id}">
<span class="task-unit">${t.unit}</span>
<span class="task-text">${t.event.title}</span>
${badge}
</div>`;
}).join("");
sb.querySelectorAll(".task").forEach(el=>{
el.onclick = ()=>{
const tid = el.dataset.tid;
const task = S.tasks.find(t=>t.id===tid);
if(!task || task.status==="done") return;
// walk to location then open
movePlayerTo(task.unit);
setTimeout(()=>openTaskEvent(task), 650);
};
});
}
document.getElementById("sheetHead").onclick = ()=>{
document.getElementById("sheetBody").classList.toggle("collapsed");
};
// ===== Location click =====
function onLocationClick(locKey){
if(S.inEvent||S.gameover) return;
// if there's an open task at this location, trigger it
const task = S.tasks.find(t=>t.unit===locKey && t.status==="open");
movePlayerTo(locKey);
if(task){ setTimeout(()=>openTaskEvent(task), 650); return; }
if(locKey==="store"){ setTimeout(doEatLunch, 650); return; }
if(locKey==="office"){ renderActions(); return; }
if(locKey==="court"){ toast("中庭：安靜的午後。"); return; }
toast(`走到 ${LOCATIONS[locKey]?.label||locKey}，沒事。`);
}
// ===== Event Modal =====
function openTaskEvent(task){
S.inEvent = true;
const ev = task.event;
const t = ev.tenant || {name:"住戶",emoji:"👤",issue:ev.tag||""};
const bg = document.createElement("div");
bg.className="modal-bg";
bg.innerHTML = `<div class="modal">
<div class="modal-portrait">
<div class="portrait">${t.emoji}</div>
<div class="mp-info">
<div class="mp-unit">${task.unit} · ${ev.tag}</div>
<div class="mp-name">${t.name}</div>
<span class="mp-tag">${t.issue}</span>
</div>
<div class="mp-time">${fmtTime(S.time)}</div>
</div>
<div class="modal-body">
<div class="m-desc">${ev.desc}</div>
<div class="m-prompt">你的處理方式</div>
<div id="chList"></div>
</div>
</div>`;
document.getElementById("stage").appendChild(bg);
const list = bg.querySelector("#chList");
ev.choices.forEach(c=>{
const b = document.createElement("button");
b.className="choice";
b.innerHTML = `<div class="ch-text">${c.text}</div>
<div class="ch-note">${c.note||""}</div>
<div class="ch-deltas">
${c.cash?`<span class="${c.cash<0?'neg':'pos'}">${c.cash<0?'':'+'}$${c.cash.toLocaleString()}</span>`:""}
${c.rep?`<span class="${c.rep<0?'neg':'pos'}">${c.rep<0?'':'+'}${c.rep} 聲譽</span>`:""}
${c.hp?`<span class="${c.hp<0?'neg':'pos'}">${c.hp<0?'':'+'}${c.hp} 體力</span>`:""}
</div>`;
b.onclick = ()=>{
applyChoice(ev,c);
task.status="done";
bg.remove();
S.inEvent=false;
advanceTime(60); // handling a case = 1 hour
renderSheet();
buildScene();
renderActions();
checkEnd();
};
list.appendChild(b);
});
}
function applyChoice(ev,c){
S.cash += c.cash||0;
S.rep = Math.max(0,Math.min(100,S.rep+(c.rep||0)));
S.hp = Math.max(0,Math.min(100,S.hp+(c.hp||0)));
S.log.unshift(`Day ${S.day}｜${ev.title} → ${c.text}`);
const parts=[];
if(c.cash) parts.push((c.cash>0?"+":"")+"$"+c.cash.toLocaleString());
if(c.rep) parts.push((c.rep>0?"+":"")+c.rep+" 聲譽");
if(c.hp) parts.push((c.hp>0?"+":"")+c.hp+" 體力");
if(parts.length) fx(parts.join(" "), (c.cash<0||c.rep<0||c.hp<0)?"#ff8b70":"#9ad17f");
updateHUD();
}
// ===== Actions =====
function renderActions(){
const row = document.getElementById("actRow");
const label = document.getElementById("actLabel");
row.innerHTML = "";
const open = S.tasks.filter(t=>t.status==="open");
label.textContent = open.length ? `你在 ${LOCATIONS[S.playerPos]?.label||S.playerPos}｜還有 ${open.length} 項待辦` : `你在 ${LOCATIONS[S.playerPos]?.label||S.playerPos}｜今天都處理完了`;
// Up to 3 urgent task shortcuts
open.slice(0,3).forEach(t=>{
const b = document.createElement("button");
b.className="act-btn warn";
b.innerHTML = `去 ${t.unit}`;
b.onclick = ()=>{ movePlayerTo(t.unit); setTimeout(()=>openTaskEvent(t), 650); };
row.appendChild(b);
});
// Universal actions
const eat = document.createElement("button");
eat.className="act-btn gold";
eat.innerHTML = "吃便當<br/><small style='font-size:10px;font-weight:400;'>-$120 +15體力</small>";
eat.onclick = doEatLunch;
row.appendChild(eat);
const off = document.createElement("button");
off.className="act-btn ghost";
off.innerHTML = "下班<br/><small style='font-size:10px;'>進入下一天</small>";
off.onclick = doEndDay;
row.appendChild(off);
}
function doEatLunch(){
if(S.cash<120){toast("錢包空空，吃不起便當。");return;}
S.cash -= 120;
S.hp = Math.min(100, S.hp+15);
advanceTime(45);
fx("+15 體力 (-$120)", "#9ad17f");
updateHUD();
renderActions();
}
function doEndDay(){
// settle
const income = S.rooms * 900;
S.cash += income;
// penalty for unfinished urgent tasks
const unfinished = S.tasks.filter(t=>t.status==="open");
const urgentUnfinished = unfinished.filter(t=>["急修","投訴","欠租"].includes(t.event.tag));
if(urgentUnfinished.length){
S.rep = Math.max(0, S.rep - urgentUnfinished.length*4);
toast(`⚠️ 有 ${urgentUnfinished.length} 項緊急沒處理，聲譽 -${urgentUnfinished.length*4}`);
}
S.hp = Math.min(100, S.hp + 8); // 睡覺恢復
S.day++;
S.time = 9*60;
S.playerPos = "office";
movePlayerTo("office");
updateHUD();
checkEnd();
if(!S.gameover){
toast(`☀️ Day ${S.day}｜租金 +$${income.toLocaleString()}`);
generateDayTasks();
buildScene();
renderActions();
}
}
function advanceTime(mins){
S.time += mins;
if(S.time >= 20*60){
toast("已經很晚了，該下班了⋯");
}
updateHUD();
}
function fmtTime(mins){
const h = Math.floor(mins/60), m = mins%60;
return `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}`;
}
// ===== End =====
function checkEnd(){
if(S.inEvent) return;
if(S.cash<-20000){end(false,"資金斷鏈，被大房東掃地出門。");}
else if(S.rep<=0){end(false,"聲譽歸零，爆料公社頭版，再也沒人要租你的房。");}
else if(S.hp<=0){end(false,"過勞送醫，決定退出房東圈改賣雞排。");}
else if(S.day>S.maxDay){end(true,"你撐過了 30 天。恭喜，你正式成為一名合格的租賃管理人員。");}
}
function end(win,msg){
S.gameover=true; S.win=win; S.endMsg=msg; S.running=false;
saveBest();
const es = document.getElementById("endScr");
es.classList.remove("hide");
document.getElementById("endTag").className = "end-tag "+(win?"win":"lose");
document.getElementById("endTag").textContent = win?"GAME CLEAR":"GAME OVER";
document.getElementById("endTitle").textContent = win?"你撐住了":"人森，暫停";
document.getElementById("endMsg").textContent = msg;
document.getElementById("endStats").innerHTML = `
<div>撐了 <b>${S.day-1}</b> 天</div>
<div>現金 <b>$${S.cash.toLocaleString()}</b></div>
<div>聲譽 <b>${S.rep}</b></div>
<div>體力 <b>${S.hp}</b></div>
<div style="grid-column:1/-1;margin-top:4px;">歷史最佳：<b>${getBest()} 天</b></div>`;
}
// ===== HUD =====
function updateHUD(){
document.getElementById("dayNum").textContent = S.day;
document.getElementById("timeNow").textContent = fmtTime(S.time);
const cE=document.getElementById("cash");
cE.textContent = "$"+S.cash.toLocaleString();
cE.className = "cash"+(S.cash<0?" neg":"");
document.getElementById("repN").textContent = S.rep;
document.getElementById("hpN").textContent = S.hp;
document.getElementById("rmN").textContent = S.rooms;
document.getElementById("repBar").style.width = S.rep+"%";
document.getElementById("hpBar").style.width = S.hp+"%";
}
function toast(text){
const t=document.getElementById("toast");
const m=document.createElement("div");m.className="msg";m.textContent=text;
t.appendChild(m);setTimeout(()=>m.remove(),2600);
}
function fx(text,color){
const d=document.createElement("div");
d.className="delta";d.style.color=color;d.textContent=text;
document.getElementById("stage").appendChild(d);
setTimeout(()=>d.remove(),1500);
}
// ===== Start =====
function startGame(){
Object.assign(S,{day:1,time:9*60,cash:50000,rep:60,hp:100,rooms:6,seen:[],log:[],tasks:[],gameover:false,win:false,endMsg:"",playerPos:"office",running:true,inEvent:false});
document.getElementById("intro").classList.add("hide");
document.getElementById("endScr").classList.add("hide");
document.getElementById("hud").classList.remove("hide");
document.getElementById("sceneWrap").classList.remove("hide");
document.getElementById("sheet").classList.remove("hide");
document.getElementById("actionBar").classList.remove("hide");
generateDayTasks();
buildScene();
updateHUD();
renderActions();
toast("☀️ Day 1 09:00｜打開交班單看看");
}
document.getElementById("startBtn").onclick = startGame;
document.getElementById("againBtn").onclick = startGame;
document.getElementById("shareBtn").onclick = ()=>{
const t=`我在《租賃管理人員的人森》撐了 ${S.day-1} 天｜現金 $${S.cash}｜聲譽 ${S.rep}｜體力 ${S.hp}\n${S.endMsg}\nhttps://haohuei.github.io/rental-manager-life/`;
if(navigator.share){navigator.share({title:"租賃管理人員的人森",text:t}).catch(()=>{});}
else{try{navigator.clipboard.writeText(t);alert("戰績已複製！");}catch(e){alert(t);}}
};
</script>
</body>
</html>
