      { "text": "回「冷氣開那麼久當然貴」", "cash": 0, "rep": -5, "hp": 1, "note": "她決定搬走。省電費但空租。" }

const STATE = {
  day:1, maxDay:30, cash:50000, rep:60, hp:100, rooms:5,
  seen:[], log:[], gameover:false, win:false, endMsg:""
};
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function fx(text,color){const d=document.createElement("div");d.className="delta";d.style.color=color;d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}

function pickEvent(){
  const pool=EVENTS.filter(e=>!STATE.seen.includes(e.id));
  const src=pool.length?pool:EVENTS;
  const ev=src[Math.floor(Math.random()*src.length)];
  if(pool.length) STATE.seen.push(ev.id);
  return ev;
}

function applyChoice(ev,c){
  STATE.cash+=c.cash||0;
  STATE.rep=clamp(STATE.rep+(c.rep||0),0,100);
  STATE.hp=clamp(STATE.hp+(c.hp||0),0,100);
  STATE.log.unshift(`Day ${STATE.day}｜${ev.title} → ${c.text}`);
  const p=[];
  if(c.cash) p.push((c.cash>0?"+":"")+"$"+c.cash.toLocaleString());
  if(c.rep) p.push((c.rep>0?"+":"")+c.rep+" 聲譽");
  if(c.hp) p.push((c.hp>0?"+":"")+c.hp+" 體力");
  if(p.length) fx(p.join("  "), (c.cash<0||c.rep<0||c.hp<0)?"#ff8b70":"#9ad17f");
  endOfDay();
}

function endOfDay(){
  STATE.cash+=STATE.rooms*900;
  STATE.hp=clamp(STATE.hp+4,0,100);
  STATE.day++;
  checkEnd();
  if(!STATE.gameover) renderDay();
}

function checkEnd(){
  if(STATE.cash<-20000){STATE.gameover=true;STATE.endMsg="資金斷鏈，被大房東掃地出門。";}
  else if(STATE.rep<=0){STATE.gameover=true;STATE.endMsg="聲譽歸零，爆料公社頭版，再也沒人要租你的房。";}
  else if(STATE.hp<=0){STATE.gameover=true;STATE.endMsg="過勞送醫，決定退出房東圈改賣雞排。";}
  else if(STATE.day>STATE.maxDay){STATE.gameover=true;STATE.win=true;STATE.endMsg="你撐過了 30 天。恭喜，你正式成為一名合格的租賃管理人員。";}
  if(STATE.gameover) renderEnd();
}

function resetState(){Object.assign(STATE,{day:1,cash:50000,rep:60,hp:100,rooms:5,seen:[],log:[],gameover:false,win:false,endMsg:""});}

function renderIntro(){
  const app=document.getElementById("app");
  app.innerHTML=`
  <div class="screen center">
    <div class="trees"></div>
    <div class="z10" style="width:100%;max-width:380px;">
      <div class="brand-small">A GAME BY @a0921925365</div>
      <h1 class="title-logo title-xl" style="color:var(--beige);">租賃管理<br/>人員的人森</h1>
      <div class="subtitle">這不是人生，是人森 — 代管房東的日常修羅場</div>
      <div class="card" style="margin-bottom:20px;">
        <div class="label">遊戲說明</div>
        <div class="body">
          你是台北某區的二房東／代管，手上 5 間房、現金 5 萬、聲譽 60、體力 100。<br/>
          每天會發生一件事。你的選擇影響數值。<br/>
          <b>撐滿 30 天，你就贏了。</b>
        </div>
      </div>
      <button class="btn-primary" id="startBtn">開始今天的輪班</button>
      <div class="foot">靈感：所有被半夜 Line 吵醒的房東</div>
    </div>
  </div>`;
  document.getElementById("startBtn").onclick=()=>{resetState();renderDay();};
}

function statBar(label,val,color){
  const pct=Math.max(0,Math.min(100,val));
  return `<div class="stat-pill"><div class="stat-row"><span>${label}</span><span>${val}</span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}

function renderDay(){
  const ev=pickEvent();
  const app=document.getElementById("app");
  app.innerHTML=`
  <div class="screen fade-in">
    <div class="header">
      <div class="header-row">
        <div>
          <div class="day-tag">DAY ${STATE.day} / ${STATE.maxDay}</div>
          <div class="title-logo title-md" style="color:var(--beige);">租賃管理人員的人森</div>
        </div>
        <div>
          <div class="cash-label">現金</div>
          <div class="cash-val ${STATE.cash<0?'neg':''}">$${STATE.cash.toLocaleString()}</div>
        </div>
      </div>
      <div class="stats">
        ${statBar("聲譽",STATE.rep,"#9ad17f")}
        ${statBar("體力",STATE.hp,"#e8b84a")}
        <div class="stat-pill narrow"><div class="rooms"><div class="stat-row" style="justify-content:center;">房源</div><div class="n">${STATE.rooms} 間</div></div></div>
      </div>
    </div>
    <div class="body-area">
      <div class="event-card">
        <div class="event-meta">
          <span class="tag">${ev.tag}</span>
          <span class="event-time">${ev.time}</span>
        </div>
        <h2 class="event-title">${ev.title}</h2>
        <p class="event-desc">${ev.desc}</p>
      </div>
      <div class="choices-label">選擇你的處理方式</div>
      <div id="choices"></div>
    </div>
  </div>`;
  const ch=document.getElementById("choices");
  ev.choices.forEach(c=>{
    const b=el(`<button class="choice">
      <div class="choice-text">${c.text}</div>
      <div class="choice-note">${c.note||""}</div>
      <div class="choice-deltas">
        ${c.cash?`<span class="${c.cash<0?'neg':'pos'}">${c.cash<0?'':'+'}$${c.cash.toLocaleString()}</span>`:""}
        ${c.rep?`<span class="${c.rep<0?'neg':'pos'}">${c.rep<0?'':'+'}${c.rep} 聲譽</span>`:""}
        ${c.hp?`<span class="${c.hp<0?'neg':'pos'}">${c.hp<0?'':'+'}${c.hp} 體力</span>`:""}
      </div>
    </button>`);
    b.onclick=()=>applyChoice(ev,c);
    ch.appendChild(b);
  });
}

function renderEnd(){
  const app=document.getElementById("app");
  app.innerHTML=`
  <div class="screen center">
    <div class="trees"></div>
    <div class="z10" style="width:100%;max-width:380px;">
      <div class="end-tag ${STATE.win?'win':'lose'}">${STATE.win?"GAME CLEAR":"GAME OVER"}</div>
      <h1 class="title-logo title-lg" style="color:var(--beige);">${STATE.win?"你撐住了":"人森，暫停"}</h1>
      <div class="card">
        <div class="body" style="margin-bottom:12px;">${STATE.endMsg}</div>
        <div class="end-stats">
          <div>撐了 <b>${STATE.day-1}</b> 天</div>
          <div>現金 <b>$${STATE.cash.toLocaleString()}</b></div>
          <div>聲譽 <b>${STATE.rep}</b></div>
          <div>體力 <b>${STATE.hp}</b></div>
        </div>
      </div>
      <div class="card log-card">
        <div class="label">今回合日誌</div>
        ${STATE.log.slice(0,10).map(l=>`<div class="log-item">· ${l}</div>`).join("")}
      </div>
      <div class="end-row">
        <button class="btn-primary" id="againBtn">再來一輪</button>
        <button class="btn-ghost" id="shareBtn">分享戰績</button>
      </div>
      <div class="foot">追蹤 @a0921925365 看更多代管日常</div>
    </div>
  </div>`;
  document.getElementById("againBtn").onclick=()=>{resetState();renderDay();};
  document.getElementById("shareBtn").onclick=()=>{
    const t=`我在《租賃管理人員的人森》撐了 ${STATE.day-1} 天｜現金 $${STATE.cash}｜聲譽 ${STATE.rep}｜體力 ${STATE.hp}\n${STATE.endMsg}`;
    if(navigator.share){navigator.share({title:"租賃管理人員的人森",text:t}).catch(()=>{});}
    else{try{navigator.clipboard.writeText(t);alert("戰績已複製！");}catch(e){alert(t);}}
  };
}

renderIntro();
</script>
